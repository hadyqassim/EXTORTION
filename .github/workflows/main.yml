name: Build Audio2MIDI (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S audio2midi-vst -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Audio2MIDI-Windows
          path: build/**/*.vst3
